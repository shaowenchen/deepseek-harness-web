services:
  dsh-web:
    image: shaowenchen/deepseek-harness-web:latest
    build: .
    container_name: dsh-web
    restart: unless-stopped
    ports:
      - "${PORT:-3080}:3080"
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env}
      # Official DeepSeek path (used when BASE_URL is empty).
      DEEPSEEK_API_KEY: ${API_KEY}
      # Custom OpenAI-compatible gateway (optional).
      BASE_URL: ${BASE_URL:-}
      MODEL: ${MODEL:-}
      TRUSTED_HOST: ${TRUSTED_HOST:-}
      # Optional S3 / S3-compatible workspace (s3fs → /workspace).
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PATH: ${S3_PATH:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-1}
      S3_REGION: ${S3_REGION:-}
      DSH_TELEMETRY_DISABLED: "1"
    volumes:
      - ./data:/dsh
      # Local fallback mountpoint; covered by s3fs when S3_BUCKET is set.
      - ./workspace:/workspace
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
