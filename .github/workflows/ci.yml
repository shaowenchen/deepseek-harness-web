name: Build and push

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Verify the image before anything is pushed: boot the container, exercise
  # the env-driven config path, and statically scan the dsh browser bundles for
  # globals older browsers lack (the class of bug that crashed the UI after the
  # 0.1.5-alpha.2 upgrade: "Can't find variable: Iterator").
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dsh-web:verify
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Static scan — browser globals in dsh bundles
        run: |
          set -eux
          DSH_VERSION=$(grep '^ARG DSH_VERSION' Dockerfile | sed 's/.*=//; s/^[[:space:]]*//; s/[[:space:]]*$//')
          # Scan the same bundle sources the image ships (installed fresh to
          # avoid depending on the image's persisted .dsh).
          mkdir -p /tmp/scan && cd /tmp/scan
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund "@deepseek-ai/dsh@${DSH_VERSION}" >/dev/null 2>&1
          # The ES2024 Iterator global is absent in older browsers; *any*
          # property access on it (Iterator.prototype.x) throws ReferenceError,
          # even inside a typeof guard, because evaluating the reference itself
          # throws. This is the exact class of bug that crashed the UI after the
          # 0.1.5-alpha.2 upgrade ("Can't find variable: Iterator" from
          # dsh-client-ui-sidebar-documentpreview). Bare `typeof Iterator` and
          # Symbol.iterator / AsyncIterableIterator (type names) are safe and
          # are NOT flagged.
          FAIL=0
          for pattern in 'Iterator.prototype' 'Iterator.from(' 'Iterator.helpers'; do
            while IFS= read -r f; do
              echo "UNGUARDABLE '${pattern}' in $f" >&2
              FAIL=1
            done < <(grep -rl "$pattern" node_modules/@deepseek-ai/dsh-*/lib/client*.js 2>/dev/null || true)
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "ERROR: dsh @${DSH_VERSION} ships browser bundles that reference the ES2024" >&2
            echo "Iterator global, which older browsers lack — same class of bug as" >&2
            echo "'Can't find variable: Iterator' (0.1.5-alpha.2)." >&2
            exit 1
          fi
          echo "browser-global scan OK for dsh @${DSH_VERSION}"

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: shaowenchen
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            shaowenchen/deepseek-harness-web:latest
            shaowenchen/deepseek-harness-web:master
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
