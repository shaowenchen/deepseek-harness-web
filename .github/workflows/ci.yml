name: Build and push

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: shaowenchen
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            shaowenchen/deepseek-harness-web:latest
            shaowenchen/deepseek-harness-web:master
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
